plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ray.fantufix'
    compileSdk 34

    defaultConfig {
        applicationId "com.ray.fantufix"
        minSdk 29
        targetSdk 34
        versionCode 3
        versionName "1.0.2"
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("KEYSTORE_FILE") ?: "../keys/fantufix-release.keystore")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: "fantufix2026"
            keyAlias System.getenv("KEY_ALIAS") ?: "fantufix"
            keyPassword System.getenv("KEY_PASSWORD") ?: "fantufix2026"
            storeType "PKCS12"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def name = "FanTuFix-v${variant.versionName}-b${variant.versionCode}.apk"
            outputFileName = name
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'androidx.media3:media3-transformer:1.4.1'
    implementation 'androidx.media3:media3-effect:1.4.1'
    implementation 'androidx.media3:media3-common:1.4.1'
}
